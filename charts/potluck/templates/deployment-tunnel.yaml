{{- if .Values.tunnel.enabled }}
# Cloudflare Tunnel.
#
# The reason there is no Ingress, no LoadBalancer and no public IP in this
# chart: the cluster dials OUT to Cloudflare and traffic arrives down that
# connection. Nothing on the internet can reach the node directly, the VM needs
# no inbound firewall rule, and Azure's per-IP charge never applies.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "potluck.fullname" . }}-tunnel
  labels:
    {{- include "potluck.labels" . | nindent 4 }}
    app.kubernetes.io/component: tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "potluck.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: tunnel
  template:
    metadata:
      labels:
        {{- include "potluck.labels" . | nindent 8 }}
        app.kubernetes.io/component: tunnel
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: cloudflared
          image: {{ .Values.tunnel.image }}
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tunnel.secretName }}
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
{{- end }}
