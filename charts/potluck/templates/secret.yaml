{{- if .Values.secrets.create }}
# Only created when explicitly asked for — CI does this with --set so the
# ephemeral cluster has credentials for its throwaway database.
#
# Production does NOT use this path. There the Secret is created out of band, so
# a real credential never passes through a values file, a CI log or `helm get
# values`. The chart references it by name and never contains it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "potluck.labels" . | nindent 4 }}
type: Opaque
stringData:
  databaseUrl: {{ required "secrets.databaseUrl is required when secrets.create is true" .Values.secrets.databaseUrl | quote }}
  authSecret: {{ required "secrets.authSecret is required when secrets.create is true" .Values.secrets.authSecret | quote }}
  groqApiKey: {{ .Values.secrets.groqApiKey | quote }}
{{- end }}
