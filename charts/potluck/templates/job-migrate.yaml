{{- if .Values.migrations.enabled }}
# Migrations run as a Helm hook BEFORE the new pods start, so the schema is
# never behind the code that expects it. If this job fails the release is
# aborted and the previous version keeps serving — which is the whole point of
# doing it as a hook rather than an init container on every pod.
#
# It also applies rls.sql and search.sql, so a deploy that adds a table without
# a policy fails here rather than shipping something unprotected.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "potluck.fullname" . }}-migrate
  labels:
    {{- include "potluck.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  # Clean up after itself; a cluster littered with completed migration jobs is
  # noise, and the logs are captured by CI before this expires.
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "potluck.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: migrate
          image: {{ include "potluck.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "apps/api/dist/db/migrate.js"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            {{- include "potluck.env" . | nindent 12 }}
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 192Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
