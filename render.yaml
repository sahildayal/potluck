# Render blueprint.
#
# Two services, both on the free tier, both card-free:
#
#   potluck-api  — the container from the repo's Dockerfile
#   potluck-web  — the built PWA as a static site
#
# 750 instance-hours a month is roughly one month, so exactly one always-on
# service fits. That is why WORKER_INLINE is true here: the import queue runs
# inside the API process rather than as a second deployment. The Helm chart
# splits them properly, and the same image serves both shapes.
#
# The web app is served from its own origin, so the session cookie is
# cross-site. Hence SameSite=None on the API side and an exact CORS origin —
# a wildcard is rejected by browsers once credentials are involved.

services:
  - type: web
    name: potluck-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "8787"
      - key: WORKER_INLINE
        value: "true"
      - key: APP_URL
        # The static site's URL. Set after the first deploy, once Render has
        # assigned it — it is the CORS allowlist and the cookie's origin, so it
        # has to be exact.
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: potluck-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @potluck/web build
    staticPublishPath: ./apps/web/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      # A single-page app: every unknown path is the app's own routing, not a
      # missing file. Without this, refreshing on /browse or /shopping 404s.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      # The service worker must never be cached, or an installed app can pin
      # itself to an old build and never see another deploy.
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
